spring.application.name={% name %}
server.port=${PORT:8080}
{% if db_server %}

# Overridden in Docker Compose by SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
spring.datasource.url={% jdbc_url_local %}
spring.datasource.username={% db_user %}
spring.datasource.password={% db_password %}
# keep trying for a minute when the database is still starting, instead of failing at once
spring.datasource.hikari.initialization-fail-timeout=60000
{% endif %}
{% if h2 %}

# H2 runs inside the app and keeps its data in ./data (git-ignored). Delete that folder to start over.
spring.datasource.url={% jdbc_url_local %}
spring.datasource.username=sa
spring.datasource.password=
{% endif %}
