{% if has_db %}
{% if postgres %}
# H2 in PostgreSQL mode: the tests run the real Flyway migrations without needing a database server
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
{% endif %}
{% if mysql %}
# H2 in MySQL mode: the tests run the real Flyway migrations without needing a database server
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
{% endif %}
{% if h2 %}
# an in-memory database for the tests, so they never touch ./data
spring.datasource.url=jdbc:h2:mem:test
{% endif %}
spring.datasource.username=sa
spring.datasource.password=
{% endif %}
